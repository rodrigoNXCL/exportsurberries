[build]
command = "npm run build"
publish = "dist"

# ============================================
# MODO MANTENCIÓN ADMINISTRATIVA
# Todo el sitio muestra únicamente /mantenimiento
# ============================================

# Recursos necesarios para la página de mantención
[[redirects]]
from = "/images/*"
to = "/images/:splat"
status = 200
force = true

[[redirects]]
from = "/_astro/*"
to = "/_astro/:splat"
status = 200
force = true

[[redirects]]
from = "/favicon.ico"
to = "/favicon.ico"
status = 200
force = true

[[redirects]]
from = "/favicon.svg"
to = "/favicon.svg"
status = 200
force = true

[[redirects]]
from = "/robots.txt"
to = "/robots.txt"
status = 200
force = true

[[redirects]]
from = "/sitemap.xml"
to = "/sitemap.xml"
status = 200
force = true

# Página de mantención (evita bucle)
[[redirects]]
from = "/mantenimiento"
to = "/mantenimiento"
status = 200
force = true

[[redirects]]
from = "/mantenimiento/*"
to = "/mantenimiento/:splat"
status = 200
force = true

# Todo lo demás -> mantención
[[redirects]]
from = "/*"
to = "/mantenimiento"
status = 200
force = true

# ============================================
# HEADERS - Seguridad
# ============================================
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
